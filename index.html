<!DOCTYPE html>
<html lang="nl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Craft and Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome voor een mooi LinkedIn icoontje -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://consent.cookiefirst.com/sites/craftandcode.be-c68ffa3a-7fb0-48cd-967d-e1a3696562f6/consent.js"></script>
</head>
<body class="bg-slate-50 min-h-full flex items-center justify-center p-6 font-sans">

    <div class="max-w-4xl w-full flex flex-col items-center">
        
        <!-- Header: Logo & Info -->
        <div class="flex flex-col items-center mb-8 text-center">
            <!-- Het kleine Logo -->
            <div class="mb-4 transition-transform duration-500 hover:rotate-6">
                <img src="https://i.imgur.com/9k4m2Og.png" alt="Logo" class="w-16 h-16 object-contain">
            </div>
            
            <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
                Ward Kennes
            </h1>
            <p class="text-indigo-600 font-medium tracking-wide uppercase text-sm mb-4">
                Software Developer
            </p>
            
            <!-- LinkedIn Button -->
            <a href="https://www.linkedin.com/in/wardkennes/?utm_source=website-craft-and-code&utm_medium=link&utm_campaign=general&utm_id=online" 
               target="_blank" 
               class="inline-flex items-center px-5 py-2.5 bg-[#0077b5] hover:bg-[#005a87] text-white text-sm font-semibold rounded-lg transition-all shadow-md hover:shadow-lg active:scale-95">
                <i class="fab fa-linkedin mr-2 text-lg"></i>
                Connect op LinkedIn
            </a>
        </div>

        <!-- Image Container (Jouw originele afbeelding) -->
        <div class="w-full flex justify-center">
            <img 
                src="https://i.imgur.com/9k4m2Og.png" 
                alt="Craft and Code - Ward Kennes"
                class="w-full md:w-4/5 lg:w-3/4 h-auto rounded-2xl shadow-2xl shadow-slate-300 transition-transform duration-500 hover:scale-[1.01]"
            >
        </div>

        <!-- Footer Footer -->
        <footer class="mt-12 text-slate-400 text-xs uppercase tracking-widest">
            Craft and Code &copy; 2026
        </footer>
    </div>

</body>
</html>
